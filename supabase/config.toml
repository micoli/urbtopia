# Local Supabase for development and CI. No secret belongs in this file:
# the production project is configured through the GitHub `production` Environment.
project_id = "urbix"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true

[auth.rate_limit]
# Per hour and per IP. Bounds anonymous sign-up abuse until a CAPTCHA is justified.
anonymous_users = 30
sign_in_sign_ups = 30
token_refresh = 150
email_sent = 4

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
