<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>PROTOTYPE render-bench (throwaway)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9ad;font:12px monospace;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;left:0;top:0;right:0;background:#000a;color:#fff;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #hud button{font:inherit;padding:6px 8px}
  #stats{width:100%;white-space:pre}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button id="mode">mode</button>
  <button id="chunk">chunk</button>
  <button id="lod">lod</button>
  <button id="size">size</button>
  <button id="shadow">shadow</button>
  <button id="dpr">dpr</button>
  <button id="low">models</button>
  <div id="stats"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
