<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PROTOTYPE asset-viewer (throwaway)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfd8e3;font:12px monospace}
  #app{display:grid;grid-template-columns:150px 1fr 230px;grid-template-rows:auto 1fr;height:100%}
  @media (max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:auto 25% 40% 1fr}#bar,#list,#view,#side{grid-column:1}}
  #bar{grid-column:1/4;background:#222;color:#fff;padding:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  #bar button{font:inherit;padding:4px 8px}
  #bar button.on{background:#fc0}
  #list{overflow:auto;background:#fff;border-right:1px solid #888}
  #list div{padding:3px 6px;cursor:pointer;display:flex;justify-content:space-between}
  #list div:hover{background:#eef}
  #list div.sel{background:#fc0}
  #list div.done{color:#070}
  #view{position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%}
  #side{background:#fff;border-left:1px solid #888;padding:8px;overflow:auto}
  #side h3{margin:0 0 6px}
  #side .row{margin:6px 0}
  #side button{font:inherit;padding:3px 6px}
  #side button.on{background:#fc0}
  #legend{position:absolute;left:6px;bottom:6px;max-width:90%;background:#fffc;padding:4px;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div id="bar"></div>
  <div id="list"></div>
  <div id="view"><canvas id="c"></canvas><div id="legend">RED = +X &nbsp; BLUE = +Z (grey strip = -Z = street side by convention) &nbsp; drag: orbit, wheel: zoom</div></div>
  <div id="side"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
