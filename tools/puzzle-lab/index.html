<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Puzzle lab</title>
<link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
<header>
  <label>Seed <input id="seed" type="text" value="lab-1" autocomplete="off" /></label>
  <label>Difficulty
    <select id="difficulty"><option>easy</option><option>medium</option><option>hard</option></select>
  </label>
  <button id="next-seed" type="button">Next seed</button>
  <label>Lighting <select id="lighting"></select></label>
  <label><input id="show-trail" type="checkbox" /> Show the path of the ball</label>
</header>
<main>
  <section id="board-panel">
    <div id="board-frame">
      <canvas id="board"></canvas>
      <div id="gizmo"><canvas id="gizmo-canvas" width="240" height="240"></canvas><output id="angles"></output></div>
    </div>
    <div id="playback">
      <button id="reset" type="button">Reset</button>
      <button id="step" type="button">Step</button>
      <button id="play" type="button">Play</button>
      <input id="tick" type="range" min="0" max="0" value="0" />
      <span id="tick-label"></span>
    </div>
    <p id="verdict"></p>
    <div id="tray"></div>
    <div id="edit-actions"><button id="undo" type="button">Undo</button> <button id="clear" type="button">Clear</button> <button id="solve" type="button">Solve</button> <button id="take-back" type="button">Take back</button></div>
  </section>
  <aside>
    <h2>Physics</h2>
    <div id="physics-actions"><button id="physics-reset" type="button">Reset physics</button> <button id="physics-copy" type="button">Copy values</button></div>
    <div id="physics"></div>
    <h2>Aims</h2>
    <ul id="aims"></ul>
    <h2>Colours</h2>
    <button id="measure" type="button">Measure colours</button>
    <table id="colour-table"></table>
    <h2>Batch</h2>
    <label>Seeds per difficulty <input id="batch-size" type="number" min="1" max="5000" value="1000" /></label>
    <button id="run-batch" type="button">Run batch</button>
    <table id="batch-table"></table>
    <ul id="batch-failures"></ul>
  </aside>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
