<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#181c28" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Urbtopia</title>
    <link rel="preload" as="image" href="/splash-paysage.jpeg" media="(orientation: landscape)" />
    <link rel="preload" as="image" href="/splash-portrait.jpeg" media="(orientation: portrait)" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #181c28 url(/splash-paysage.jpeg) center / cover no-repeat;
        transition: opacity 0.4s ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      @media (orientation: portrait) {
        #splash {
          background-image: url(/splash-portrait.jpeg);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
