# Routes the Supabase API paths to Auth and PostgREST, with CORS for the browser game.
map $request_method $cors_preflight {
  OPTIONS 1;
  default 0;
}

server {
  listen 8000;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Expose-Headers;
  add_header Access-Control-Allow-Origin * always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, prefer, accept-profile, content-profile, range" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "content-range, content-location" always;

  location /auth/v1/ {
    if ($cors_preflight) { return 204; }
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }

  location /rest/v1/ {
    if ($cors_preflight) { return 204; }
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }
}

# Email templates, fetched by Auth inside the compose network only.
server {
  listen 8088;

  location /email/ {
    alias /templates/;
  }
}
