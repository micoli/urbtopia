namespace = "ur"

[settings.web]
auto_start = true
bind_port = 3120
bind_address = "0.0.0.0"

[daemons.dev]
run = "npm run dev -- --host --port 5175 --strictPort"
dir = "."
ready_http = "http://localhost:5175/"
boot_start = false
retry = false

[daemons.assets-editor]
run = "npm run assets:editor -- --port 5181 --strictPort"
dir = "."
ready_http = "http://localhost:5181/"
boot_start = false
retry = false

[daemons.casino-sim]
run = "npm run casino:sim -- --port 5182 --strictPort"
dir = "."
ready_http = "http://localhost:5182/"
boot_start = false
retry = false

[daemons.issues]
run = "bash -c 'npm ci --no-fund --no-audit && npm run build && npm start'"
dir = "tools/issues-server"
ready-port = 4380
boot_start = false
retry = true

