name: Visual baselines

on:
  workflow_dispatch:
    inputs:
      update:
        description: Regenerate the Linux baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate the assets
        run: npm run assets
      - name: Set up Chromium
        uses: ./.github/actions/setup-chromium
      - name: Regenerate the baselines
        if: inputs.update
        run: npm run test:visual:update
      - name: Compare with the baselines
        if: '!inputs.update'
        run: npm run test:visual
      - name: Upload the Linux baselines
        if: inputs.update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines-linux
          path: e2e-baselines
      - name: Upload the diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-diffs
          path: test-results/visual
