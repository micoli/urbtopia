name: Database

on:
  pull_request:
    paths:
      - supabase/**
      - src/persistence/cloud/database.types.ts
      - package.json
      - .github/workflows/database.yml
  push:
    branches: [main]
    paths:
      - supabase/**
      - src/persistence/cloud/database.types.ts
      - package.json
      - .github/workflows/database.yml

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: 2.120.0
      # Only Postgres and Auth are needed: Auth creates the auth schema the migrations and tests rely on.
      # Starting on an empty database applies every migration from scratch.
      - run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgrest,studio,edge-runtime,logflare,vector,supavisor,kong,postgres-meta
      - run: supabase test db
      - run: supabase db lint --fail-on error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Fail if the generated types are stale
        run: |
          npm run db:types
          git diff --exit-code src/persistence/cloud/database.types.ts
