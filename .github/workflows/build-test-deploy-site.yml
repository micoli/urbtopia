name: Build, test and deploy the site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check the code
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint the code
        run: npm run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate the assets
        run: npm run assets
      - name: Run the tests
        run: npm test

  find-built-site:
    name: Look for a site built less than an hour ago from the same tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      run-id: ${{ steps.lookup.outputs.run-id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute the key of the site
        id: key
        env:
          SUPABASE_SETTINGS: ${{ vars.VITE_SUPABASE_URL }}${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          settings="$(printf '%s' "$SUPABASE_SETTINGS" | sha256sum | cut -c1-12)"
          echo "key=site-$tree-$settings" >> "$GITHUB_OUTPUT"
      - name: Look for the same site built by a run of this repository
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$KEY&per_page=100" \
            --jq "[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == $REPOSITORY_ID and .created_at > (now - 3600 | todate))] | first | .workflow_run.id // empty")"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build the site and check it
    needs: find-built-site
    if: needs.find-built-site.outputs.run-id == ''
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build the site
        run: npm run build
        env:
          RELEASE_NAME: __URBTOPIA_RELEASE_NAME__
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Fail if a server-side key reached the bundle or supabase-js left its lazy chunk
        run: node scripts/checkBundle.ts dist
      - name: Check the Codex images
        run: npm run test:codex:images
      - name: Check the Avatar images
        run: npm run test:avatars
      - name: Keep the built site for a run on the same tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.find-built-site.outputs.key }}
          path: dist
          retention-days: 1
          if-no-files-found: error

  package-site:
    name: Stamp the release name and package the site for Pages
    needs: [find-built-site, build]
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release-name: ${{ steps.release-name.outputs.name }}
    steps:
      - name: Check out the repository with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.find-built-site.outputs.key }}
          path: dist
          run-id: ${{ needs.find-built-site.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Compute the release name
        id: release-name
        run: echo "name=$(node scripts/release-name.ts)" >> "$GITHUB_OUTPUT"
      - name: Stamp the release name in the site
        env:
          RELEASE_NAME: ${{ steps.release-name.outputs.name }}
        run: node scripts/stampReleaseName.ts dist "$RELEASE_NAME"
      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' }}
    needs: [typecheck, lint, unit-tests, package-site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Create the GitHub release
    needs: [package-site, deploy]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.package-site.outputs.release-name }}
        run: gh release create "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --generate-notes
