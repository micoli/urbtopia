name: Set up Chromium for Playwright
description: Restore the Playwright Chromium from the cache, or download it, then install its system dependencies

runs:
  using: composite
  steps:
    - name: Restore the Playwright browser cache
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
    - name: Install Chromium and its system dependencies (cache miss)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    - name: Install the system dependencies of Chromium (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
